<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>PIU!</title>

    <link
        rel="stylesheet"
        href="css/splash.css"
    >

</head>

<body>

<div class="splash">

    <img
        src="img/logo.png"
        class="splash-logo"
        alt="PIU!"
    >

    <h1>PIU!</h1>

    <p id="status">
        Iniciando...
    </p>

    <div class="barra">

        <div
            id="progresso"
            class="progresso">
        </div>

    </div>

    <span id="porcentagem">
        0%
    </span>

    <span class="versao">
        PIU! v1.0.0
    </span>

</div>


<script src="js/splash.js"></script>

</body>

</html>
